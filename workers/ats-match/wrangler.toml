name = "ats-match"
main = "src/index.ts"
compatibility_date = "2026-08-18"

# Native Workers rate limiting. `period` only accepts 10 or 60 (seconds) —
# there's no built-in hourly window, so this caps bursts at the minute
# level (5 requests/IP/minute). A true hourly cap would need a second,
# KV-backed counter layered on top; out of scope for the demo-mode build.
# Verified to enforce correctly under `wrangler dev` — no live Cloudflare
# account needed for local testing.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
